[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 5
[browser]
gatherUsageStats = false
[theme]
base = "light"
font = "sans serif"
baseRadius = "0.65rem"
buttonRadius = "0.55rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#356273"
backgroundColor = "#F3F6FA"
secondaryBackgroundColor = "#E2EAF2"
textColor = "#20292E"
borderColor = "#B8C2C8"

[theme.light.sidebar]
backgroundColor = "#E6EDF4"
secondaryBackgroundColor = "#D5E0EA"

[theme.dark]
primaryColor = "#356273"
backgroundColor = "#171C20"
secondaryBackgroundColor = "#252D33"
textColor = "#E7ECEF"
borderColor = "#4A565E"

[theme.dark.sidebar]
backgroundColor = "#11161A"
secondaryBackgroundColor = "#20272C"
