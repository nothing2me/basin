name: Offline pipeline checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_snapshot_checkout.py
      - run: python -m pytest -q
      - run: python scripts/demo_smoke.py
      - run: python scripts/replay_bundle.py output/BASIN-rehearsal.zip
      - run: python scripts/package_demo.py
